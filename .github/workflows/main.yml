name: Test and Release

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  test:
    name: Run unit tests
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java: [ 25 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: ${{ matrix.java }}

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload build results
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }} Java ${{ matrix.java }} build results
          path: ${{ github.workspace }}/build/libs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }} Java ${{ matrix.java }} test results
          path: ${{ github.workspace }}/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  integration-test:
    name: Run integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          java-version: 25

      - name: Run integration tests
        run: ./gradlew integrationTest --info

      - name: Upload integration test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Integration test results
          path: ${{ github.workspace }}/build/reports/tests/integrationTest/
          if-no-files-found: ignore
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - test
      - integration-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Common Setup
        uses: ./.github/actions/common-setup

      - name: Publish with Gradle
        run: ./gradlew -Pver="0.0.0-RC-1" release

      - name: Upload build results
        uses: actions/upload-artifact@v7
        with:
          name: Release Build
          path: ${{ github.workspace }}/build/libs/
          if-no-files-found: error
          retention-days: 14
