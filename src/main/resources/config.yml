# Prefix prepended to messages NewEraCore sends to players.
# Supports MiniMessage formatting: https://docs.advntr.dev/minimessage/format.html
message-prefix: "<gray>[<aqua>NewEraCore<gray>]</gray> "

# World corruption engine — ashen nuclear winter.
# Each chunk is corrupted exactly once, when it first generates. Chunks that already existed before
# the plugin was installed, and anything players have built, are never touched.
#
# Two principles run through all of this:
#
#   1. ASH FALLS ON EVERYTHING. Coverage is near-universal and only its DEPTH varies, the way snow
#      works in a winter biome. Leaving half the world vanilla and swapping blocks in the other half
#      is what makes a world look griefed rather than ruined.
#   2. WHOLE SHAPES, NOT BLOCK EDITS. A tree is either alive and untouched, or dead with no leaves at
#      all and a charred trunk. Deleting a share of a living tree's leaves leaves a healthy shape full
#      of holes, which is the clearest griefing signature there is.
#
# Where things land is decided by the terrain and by noise, never by a per-block dice roll: ash piles
# up in hollows, blows off steep faces down to bare rock, and whole stands of trees share one fate.
#
# Thresholds are PERCENTILES of their field (the fields are calibrated, so 0.4 really is the worst
# 60%). LOWER a threshold to affect MORE. 1.0 disables a feature; 0.0 makes it universal.
world-engine:
  enabled: true

  # How many blocks below each column's surface the engine inspects. Range: 1-64.
  scan-depth: 24

  # Feature sizes, in blocks.
  noise:
    # Width of a corruption region — how far you walk before the ash deepens or thins.
    corruption-scale: 384
    # Size of the broad variation in ground treatment.
    patch-scale: 36
    # Size of a stand of trees that shares one fate.
    blight-scale: 56
    # Size of an impact zone that craters cluster inside.
    impact-scale: 128
    # Size of one patch of a single ground material. Keep this well above ~12, or materials mix block
    # by block and the ground reads as confetti instead of as areas.
    detail-scale: 20
    octaves: 3

  # Shares of the world at each level. Defaults: 34% recovered, 34% scarred, 32% devastated.
  thresholds:
    scarred-above: 0.34
    devastated-above: 0.68

  # SCATTERED STRUCTURES — premade wrecks and ruins dropped into the world as whole shapes.
  #
  # Sites live on a coarse grid in world coordinates and are derived from the world seed, for the
  # same reason huge craters are: a structure spans chunk borders, so every chunk it touches has to
  # agree on exactly where it stands and which way it faces without loading each other. A structure
  # is built the moment the last chunk of its footprint generates, as one whole shape over finished
  # terrain — never sliced.
  #
  # Built-in structures (currently the crashed fighter jet) are always registered. Drop additional
  # .nbt files saved with a structure block into plugins/NewEraCore/structures/ and they join the
  # scatter on the next restart, under their filename. /nec locate <kind> finds the nearest one.
  #
  # A file named <name>.crash.nbt registers as <name> and comes down HARD: skid trench, impact
  # crater sized from the model, scorched ground, debris, smoke — with the model seated in the
  # crater. Save crash models with the nose pointing EAST (+x); the skid comes in from the west.
  # Plain .nbt files are set into the terrain as they are, with the vegetation over their
  # footprint cleared so nothing grows through them.
  #
  # A candidate site only survives if the ground suits what was drawn for it — most kinds need dry
  # land — so `chance` is not the share that appears.
  structures:
    enabled: true
    spacing: 512      # blocks between candidate sites; larger means rarer
    chance: 0.8       # chance a candidate cell holds one — see above, not all of them survive
    jitter: 0.4       # how far a site wanders inside its cell, as a share of the cell

    # Per-template overrides, keyed by structure id — a filename without .nbt / .crash.nbt, or a
    # built-in id like fighter_jet. A template with no entry uses the defaults shown for jet.
    #
    #   enabled       false removes the template from the scatter without deleting its file
    #   crash         true/false forces the crash treatment on or off; omit the line and the
    #                 filename decides (<name>.crash.nbt crashes, <name>.nbt does not)
    #   destruction   how much of a mess the landing makes: crater, skid trench, debris, and
    #                 smoke all scale together. 0 touches the ground not at all, 1 is the
    #                 standard crash, 3 is devastation. Only crash templates read this.
    #   weight        share of the draw when a site picks what stands on it — 2.0 appears twice
    #                 as often as a template at 1.0
    #   loot          which loot table stocks this template's containers. Omit it and the
    #                 convention decides: crash templates carry `military`, plain ones `civilian`
    #                 (`hardware` ships too, assign it here). `none` switches stocking off.
    templates:
      jet:
        destruction: 1.0
        weight: 1.0

    # LOOT — what the wrecks hold. In a saved model, an EMPTY chest/barrel is the loot marker:
    # every placement rolls it fresh from the site seed (same seed, same loot — like everything
    # else about a site). A container saved WITH items keeps exactly those items, so hand-stocked
    # chests still work. The built-in fighter jet stocks its pilot's kit the same way.
    #
    # Three tables ship built in — military, civilian, hardware — and templates use them via the
    # convention above or a `loot:` line. Define your own tables here (or redefine a built-in id
    # to replace it whole). A table is a list of POOLS, vanilla-style: each pool rolls `rolls`
    # times and draws one weighted entry per roll, so themed pools keep a chest coherent — bulk
    # salvage in one, food in another, one rare prize with a heavy `nothing` beside it.
    #
    # Entry lines (ranges are written like 2-5; a single number is fine):
    #   item      a material name, or `nothing` — a weighted blank, how a pool comes up empty
    #   weight    share of the pool's draw (default 1)
    #   count     stack size range (default 1)
    #   wear      share of durability already lost, 0-0.95 — loot that survived the end of the
    #             world should look like it did
    #   enchant   enchanting-table levels to roll random enchantments with; on a `book` this
    #             makes an enchanted book, exactly like vanilla loot
    #
    # Example — a pharmacy shelf for a hospital template (`loot: medical` on that template):
    #
    # loot:
    #   medical:
    #     - rolls: 2-4
    #       entries:
    #         - {item: glistering_melon_slice, weight: 3, count: 1-3}
    #         - {item: paper, weight: 3, count: 2-6}
    #         - {item: sugar, weight: 2, count: 1-4}
    #         - {item: spider_eye, weight: 1}
    #     - rolls: 0-1
    #       entries:
    #         - {item: golden_apple, weight: 1}
    #         - {item: nothing, weight: 3}
    loot: {}

  # Rare impacts big enough to span many chunks. These are the events the rest of the world is
  # reacting to, so they are huge and far apart. Sites sit on a coarse grid in world coordinates
  # rather than being rolled per chunk, which is what lets one bowl cross chunk borders seamlessly.
  #
  # A candidate site has to pass two more tests, so `chance` is not the share that survives:
  #
  #   1. The corruption field must run at least SCARRED there, which ties the biggest hole in the
  #      ground to the darkened country around it — one event rather than two coincidences.
  #   2. The generator must put LAND there. A crater at sea carves nothing at all — water and ice are
  #      never cut — so it would be a kilometre's walk to look at open water. This alone turns away
  #      about a third of them, which is what `chance` is set high enough to pay for.
  #
  # Raise `chance` for more of them, or lower `spacing` to bring them closer together.
  huge-craters:
    spacing: 768        # blocks between candidate sites; larger means rarer
    chance: 0.6         # chance a candidate cell holds one — see below, not all of them survive
    radius-min: 18
    radius-max: 36
    depth-factor: 0.5   # depth relative to radius

  # THE ROAD NETWORK — pre-war infrastructure: highways, local roads, the towns they connect, and
  # the cars abandoned on them. Everything derives from the seed, like structures and craters, so
  # every chunk agrees where a road runs without loading anything, and /nec locate town works over
  # terrain that has never generated.
  #
  # Roads run FIRST in the pipeline because they predate the event: the ashfall settles over the
  # asphalt (paved ground is never repaved, only dusted), whole stretches lie buried under the
  # drifts — more of them the worse the corruption — and craters and crashes tear the road up.
  # Roads are never paved across water: a road that dips into a river and climbs out the far bank
  # is a washed-out crossing.
  #
  # Towns sit on the local-road grid nodes: ruined houses line the roads leaving the node, doors
  # to the asphalt, with household loot inside (the built-in `civilian` table, so redefining that
  # table under structures.loot retunes the towns too). Highways run on their own sparser grid,
  # wider, with a dashed centre line and utility poles. Cars are strewn along every road —
  # sedans, vans, pickups, some burnt out, some with a stocked boot.
  roads:
    enabled: true
    town-spacing: 1024     # blocks between candidate town cells; local roads connect neighbours
    town-chance: 0.7       # chance a cell holds a town — it also needs land at its node
    highway-spacing: 3072  # blocks between candidate highway cells
    highway-chance: 0.85   # kept high: a highway that keeps petering out is a country lane
    car-spacing: 56        # average blocks of road per abandoned car

  # Ore torn out of the ground by an impact and left lying in the open.
  ores:
    small-crater-chance: 0.07   # chance a debris block in a small crater is ore
    huge-crater-chance: 0.18    # huge craters reach deeper, so they expose more
    iron-share: 0.2             # share of exposed ore that is iron rather than coal or copper
    precious-share: 0.12        # share of huge-crater ore better than iron (gold, redstone,
                                # lapis, raw blocks, rarely diamond)

  # Rules per level. A chunk near a boundary blends towards the level below, so the ash deepens
  # gradually instead of stepping.
  levels:

    # Ash lies thin. Half the forest survived. The land still reads as the biome it was.
    recovered:
      ash-carpet-coverage: 0.55      # 55% of sheltered ground gets an ash carpet
      deep-ash-share: 0.12
      drift-chance: 0.15
      scour-slope: 4                 # only steep faces strip to rock
      living-grove-threshold: 0.35   # a third of the stands live
      snap-share: 0.25
      collapse-share: 0.1
      dead-bush-chance: 0.3
      water-drying-chance: 0.25
      impact-zone-threshold: 0.92
      craters-per-zone: 0.15
      large-crater-share: 0.0

    # Deep ash, almost no living forest, dry streams, craters in places.
    scarred:
      ash-carpet-coverage: 0.85
      deep-ash-share: 0.35
      drift-chance: 0.45
      scour-slope: 3
      living-grove-threshold: 0.05   # only a few sheltered groves hang on
      snap-share: 0.55
      collapse-share: 0.3
      dead-bush-chance: 0.4
      water-drying-chance: 0.6
      impact-zone-threshold: 0.68
      craters-per-zone: 1.0
      large-crater-share: 0.12

    # Total ash cover, nothing alive, scoured ridges, drifts in every hollow, crater clusters.
    devastated:
      ash-carpet-coverage: 1.0
      deep-ash-share: 0.7
      drift-chance: 0.8
      scour-slope: 2                 # even gentle slopes strip bare
      living-grove-threshold: 0.0    # nothing survives
      snap-share: 0.8
      collapse-share: 0.5
      dead-bush-chance: 0.45
      water-drying-chance: 0.95
      impact-zone-threshold: 0.4
      craters-per-zone: 2.0
      large-crater-share: 0.3
